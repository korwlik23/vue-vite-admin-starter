name: Admin container

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: admin-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: docker build --tag vue-vite-admin-starter:verify .
      - name: Verify runtime contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' vue-vite-admin-starter:verify)" = "101:101"
          test "$(docker image inspect --format '{{json .Config.ExposedPorts}}' vue-vite-admin-starter:verify)" = '{"8080/tcp":{}}'
          test "$(docker image inspect --format '{{json .Config.Healthcheck.Test}}' vue-vite-admin-starter:verify)" = '["CMD","wget","-q","-O","/dev/null","http://127.0.0.1:8080/"]'
